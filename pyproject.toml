[project]
name = "insider-threat-detection"
version = "0.1.0"
description = "Hierarchical Multi-Agent Insider Threat Detection using Bi-LSTM and Uni-LSTM"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "imbalanced-learn>=0.14.2",
    "jupyter>=1.1.1",
    "lab>=8.10",
    "langgraph>=1.2.9",
    "matplotlib>=3.11.0",
    "mlflow>=2.0.0",
    "numpy>=2.5.1",
    "ollama>=0.4.0",
    "pandas<3",
    "protobuf==3.20.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.0",
    "setuptools>=83.0.0",
    "streamlit>=1.60.0",
    "torch",
    "tqdm>=4.68.4",
    "uvicorn[standard]>=0.51.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[dependency-groups]
# Week-6 deployment layer (single-container demo): dashboard only.
dev = ["pytest>=8.0"]
week6 = ["streamlit>=1.40"]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
